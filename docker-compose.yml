services:
  postgres:
    image: postgres:16
    container_name: deskops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: deskops_user
      POSTGRES_PASSWORD: deskops_dev_password
      POSTGRES_DB: deskops_db
    ports:
      - "5433:5432"
    volumes:
      - deskops_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deskops_user -d deskops_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: deskops-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: deskops-backend
    restart: unless-stopped
    env_file:
    - ./backend/.env
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://deskops_user:deskops_dev_password@postgres:5432/deskops_db?schema=public
      JWT_SECRET: deskops_dev_jwt_secret_key_12345
      CORS_ORIGIN: http://localhost:5173
      REDIS_URL: redis://redis:6379
    ports:
      - "5001:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: deskops-frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env.local
    environment:
      VITE_API_URL: http://localhost:5001
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  deskops_postgres_data: