services:
  postgres:
    image: postgres:16
    container_name: deskops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: deskops_user
      POSTGRES_PASSWORD: deskops_dev_password
      POSTGRES_DB: deskops_db
    ports:
      - "5433:5432"
    volumes:
      - deskops_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deskops_user -d deskops_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: deskops-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://deskops_user:deskops_dev_password@postgres:5432/deskops_db?schema=public
    ports:
      - "5001:5000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: deskops-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  deskops_postgres_data: