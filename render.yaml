
services:
  # Backend Web Service
  - type: web
    name: deskops-backend-staging
    env: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run db:generate && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: deskops-staging-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: deskops-frontend-staging
          property: host

    # Frontend Static Site
  - type: web
    name: deskops-frontend-staging
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: deskops-backend-staging
          property: host

# Staging PostgreSQL Database
databases:
  - name: deskops-staging-db
    plan: free
    region: oregon
    databaseName: deskops_db
    user: deskops_user
