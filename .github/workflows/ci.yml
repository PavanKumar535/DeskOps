
name: DeskOps CI

on:
  push:
    branches:
      - main
      - "feature/**"

  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: deskops_user
          POSTGRES_PASSWORD: deskops_dev_password
          POSTGRES_DB: deskops_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate
        env:
          DATABASE_URL: postgresql://deskops_user:deskops_dev_password@localhost:5432/deskops_db?schema=public

      - name: Apply Database Migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://deskops_user:deskops_dev_password@localhost:5432/deskops_db?schema=public

      - name: Run Backend Tests
        run: npm test
        env:
          DATABASE_URL: postgresql://deskops_user:deskops_dev_password@localhost:5432/deskops_db?schema=public
          JWT_SECRET: deskops_ci_secret_key_testing_12345
          NODE_ENV: test
          TICKET_REOPEN_WINDOW_DAYS: "7"

      - name: Build backend
        run: npm run build

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  e2e:
    name: Playwright End-to-End Tests
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: deskops_user
          POSTGRES_PASSWORD: deskops_dev_password
          POSTGRES_DB: deskops_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: backend
        run: npm run db:generate
        env:
          DATABASE_URL: postgresql://deskops_user:deskops_dev_password@localhost:5432/deskops_db?schema=public

      - name: Apply Database Migrations
        working-directory: backend
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://deskops_user:deskops_dev_password@localhost:5432/deskops_db?schema=public

      - name: Seed Test Database
        working-directory: backend
        run: npm run seed
        env:
          DATABASE_URL: postgresql://deskops_user:deskops_dev_password@localhost:5432/deskops_db?schema=public
          JWT_SECRET: deskops_ci_secret_key_testing_12345

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start Backend, Frontend and Run E2E Tests
        working-directory: frontend
        env:
          PORT: 5000
          DATABASE_URL: postgresql://deskops_user:deskops_dev_password@localhost:5432/deskops_db?schema=public
          JWT_SECRET: deskops_ci_secret_key_testing_12345
          NODE_ENV: test
          CORS_ORIGIN: http://localhost:5173
          VITE_API_URL: http://localhost:5000
          PLAYWRIGHT_BASE_URL: http://localhost:5173
        run: |
          cd ../backend
          npm run dev > /tmp/deskops-backend.log 2>&1 &

          for i in {1..30}; do
            if curl -fsS http://localhost:5000/health > /dev/null; then
              echo "Backend is ready"
              break
            fi
            sleep 2
          done

          curl -fsS http://localhost:5000/health

          cd ../frontend
          npm run dev -- --host 0.0.0.0 > /tmp/deskops-frontend.log 2>&1 &

          for i in {1..30}; do
            if curl -fsS http://localhost:5173/ > /dev/null; then
              echo "Frontend is ready"
              break
            fi
            sleep 2
          done

          curl -fsS http://localhost:5173/ > /dev/null

          npm run test:e2e

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Docker Image Build
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t deskops-backend ./backend

      - name: Build frontend image
        run: docker build -t deskops-frontend ./frontend
