name: DeskOps CI

on:
  push:
    branches:
      - main
      - "feature/**"

  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: deskops_user
          POSTGRES_PASSWORD: deskops_dev_password
          POSTGRES_DB: deskops_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate
        env:
          DATABASE_URL: postgresql://deskops_user:deskops_dev_password@localhost:5432/deskops_db?schema=public

      - name: Apply Database Migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://deskops_user:deskops_dev_password@localhost:5432/deskops_db?schema=public

      - name: Run Backend Tests (Auth, Tenant Isolation, Ticket Lifecycle & Concurrency)
        run: npm test
        env:
          DATABASE_URL: postgresql://deskops_user:deskops_dev_password@localhost:5432/deskops_db?schema=public
          JWT_SECRET: deskops_ci_secret_key_testing_12345
          NODE_ENV: test
          # Ticket reopening window: configurable, 7-day default pending mentor confirmation
          TICKET_REOPEN_WINDOW_DAYS: "7"

      - name: Build backend
        run: npm run build

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  docker:
    name: Docker Image Build
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t deskops-backend ./backend

      - name: Build frontend image
        run: docker build -t deskops-frontend ./frontend
